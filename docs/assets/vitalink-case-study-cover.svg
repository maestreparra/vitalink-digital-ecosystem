<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">VitaLink Digital Ecosystem case study</title>
  <desc id="desc">Portfolio cover for the bilingual VitaLink Courier and VitaLink Express product-design and engineering case study.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051019"/>
      <stop offset="0.58" stop-color="#0A2F44"/>
      <stop offset="1" stop-color="#123E56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D42E2E"/>
      <stop offset="1" stop-color="#D4A5E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1128" cy="112" r="238" fill="#D4A5E8" opacity="0.08"/>
  <circle cx="1212" cy="576" r="310" fill="#D42E2E" opacity="0.08"/>
  <path d="M900 58h270" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(72 70)">
    <text x="0" y="22" fill="#D4A5E8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PRODUCT DESIGN • UX ENGINEERING</text>
    <text x="0" y="108" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">VitaLink</text>
    <text x="0" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">Digital Ecosystem</text>
    <text x="0" y="226" fill="#D4E4F7" font-family="Arial, Helvetica, sans-serif" font-size="25">From zero-brand brief to a bilingual logistics platform</text>

    <g transform="translate(0 282)" filter="url(#shadow)">
      <rect width="348" height="132" rx="18" fill="#FFFFFF"/>
      <rect width="8" height="132" rx="4" fill="#D42E2E"/>
      <text x="34" y="48" fill="#0A2F44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">VitaLink Courier</text>
      <text x="34" y="82" fill="#3D3D3A" font-family="Arial, Helvetica, sans-serif" font-size="18">Medical courier experience</text>
      <text x="34" y="108" fill="#6E7E8C" font-family="Arial, Helvetica, sans-serif" font-size="15">Greater Tampa Bay</text>
    </g>

    <g transform="translate(374 282)" filter="url(#shadow)">
      <rect width="348" height="132" rx="18" fill="#FFFFFF"/>
      <rect width="8" height="132" rx="4" fill="#D4A5E8"/>
      <text x="34" y="48" fill="#0A2F44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">VitaLink Express</text>
      <text x="34" y="82" fill="#3D3D3A" font-family="Arial, Helvetica, sans-serif" font-size="18">Multi-service delivery experience</text>
      <text x="34" y="108" fill="#6E7E8C" font-family="Arial, Helvetica, sans-serif" font-size="15">One shared product architecture</text>
    </g>

    <g transform="translate(0 462)">
      <text x="0" y="0" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Designed &amp; engineered by Giomar Maestre</text>
      <text x="0" y="34" fill="#9FBFE3" font-family="Arial, Helvetica, sans-serif" font-size="17">Strategy · Brand · UX/UI · Design System · Angular · SSR · Bilingual UX</text>
    </g>
  </g>

  <g transform="translate(958 226)">
    <circle cx="92" cy="92" r="90" fill="none" stroke="#D4A5E8" stroke-width="2" opacity="0.55"/>
    <circle cx="92" cy="92" r="58" fill="#FFFFFF" opacity="0.06"/>
    <path d="M54 92h76M92 54v76" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 155c44 36 103 36 147 0" fill="none" stroke="#D42E2E" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
